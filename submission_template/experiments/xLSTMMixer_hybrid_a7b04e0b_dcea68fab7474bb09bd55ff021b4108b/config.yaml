data:
  input: all
  pred_len: 4
  save_path: experiments/
  seq_len: 720
  stride: 12
experiment: autoregressive_forecast
model:
  base_model_kwargs:
    cutoff: 5
  hybrid: true
  model_kwargs:
    kwargs:
      xlstm_dropout: 0
      xlstm_num_blocks: 1
      xlstm_num_heads: 16
    pred_len: 4
    seq_len: 720
  model_name: xLSTMMixer
  prior: Fourier
  prior_as_feature: true
preprocessing:
  imputer: iterative
  imputer_kwargs:
    max_iter: 30
  indicator_kwargs: {}
  mice_estimator: ridge
  mice_estimator_kwargs:
    alpha: 1
  missing_indicator_columns: []
  other_impute_columns:
  - demand_forecast
  - upstream_quality_forecast
  - shock_risk
  - unit_reliability_forecast
  - queue_pressure_forecast
  - network_pressure_forecast
  - event_load_forecast
  - service_irregularity_risk_forecast
  - throughput_disruption_risk_forecast
  scale_columns:
  - trend
  - workload_intensity
  - promotion_intensity
  - maintenance_known
  scaler: standard
  scaler_kwargs: {}
  simple_impute_columns:
  - staffing_forecast
seed: 11
shared:
  criterion: Huber
  pred_len: 4
  seq_len: 720
training:
  ar_steps: 4
  batch_size: 128
  criterion: Huber
  loss_on: target
  max_epochs: 100
  min_epochs: 5
  mode: autoregressive
  optimizer: AdamW
  optimizer_kwargs:
    lr: 0.003
    weight_decay: 0
  patience: 5
