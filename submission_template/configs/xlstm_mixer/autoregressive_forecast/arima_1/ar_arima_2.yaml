experiment: autoregressive_forecast
seed: 11
shared:
  seq_len: &seq_len 336
  pred_len: &pred_len 4
  criterion: &criterion "Huber"

preprocessing:
  scaler: "standard"
  scaler_kwargs: {}
  imputer: "iterative"
  imputer_kwargs: {max_iter: 30}
  mice_estimator: "ridge"
  mice_estimator_kwargs: {alpha: 1}
  indicator_kwargs: {}
  scale_columns: 
    - "trend"
    - "workload_intensity"
    - 'promotion_intensity'
    - 'maintenance_known'
  simple_impute_columns:
    - staffing_forecast
  other_impute_columns:
    - "demand_forecast"
    - 'upstream_quality_forecast'
    - 'shock_risk'
    - 'unit_reliability_forecast'
    - 'queue_pressure_forecast'
    - 'network_pressure_forecast'
    - 'event_load_forecast'
    - 'service_irregularity_risk_forecast'
    - 'throughput_disruption_risk_forecast'
  missing_indicator_columns: []
  #convert_to_categorical:
    #- "maintenance_known"
model: 
  hybrid: True
  prior: ARIMA
  prior_as_feature: True
  base_model_kwargs: 
    order: [1,0,0]
    seasonal_order: [1,0,0,24]
    trend: 'n'
    method: 'lbfgs'
    exog_feature_names:
      - queue_pressure_forecast
      - event_load_forecast
      - network_pressure_forecast
      - demand_forecast
      - shock_risk

  model_name: xLSTMMixer
  model_kwargs: {seq_len: *seq_len, pred_len: *pred_len, kwargs: {xlstm_num_heads: 8, xlstm_num_blocks: 1, xlstm_dropout: 0}}
  
training: 
  optimizer: Adam
  optimizer_kwargs: {lr: 0.0005, weight_decay: 0}
  max_epochs: 100
  min_epochs: 5
  criterion: *criterion
  patience: 5
  batch_size: 128
  mode: autoregressive
  loss_on: target
  ar_steps: 4

data: 
  input: all
  seq_len: *seq_len
  pred_len: *pred_len
  stride: 48
  save_path: experiments/